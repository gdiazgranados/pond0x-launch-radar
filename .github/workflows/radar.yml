name: Pond0x Radar

on:
  workflow_dispatch:
    inputs:
      trigger_source:
        description: "Scheduler or operator that started this sweep"
        required: false
        default: "external-cron"
        type: string

concurrency:
  group: pond0x-radar-data-writer
  cancel-in-progress: false

jobs:
  run-radar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: |
          npm install
          cd watcher && npm install
      - name: Install Playwright
        run: npx playwright install chromium
      - name: Prepare workspace
        run: |
          mkdir -p public/data
          mkdir -p snapshots
      - name: Restore previous state from radar-data
        run: |
          git fetch origin radar-data || true
          if git ls-remote --exit-code --heads origin radar-data; then
            git worktree prune
            rm -rf /tmp/radar-restore
            git worktree add /tmp/radar-restore origin/radar-data
            cp -R /tmp/radar-restore/data/. public/data/ 2>/dev/null || true
            cp -R /tmp/radar-restore/snapshots/. snapshots/ 2>/dev/null || true
            git worktree remove /tmp/radar-restore --force || true
            rm -rf /tmp/radar-restore || true
          else
            echo "No previous state"
          fi
      - name: Write heartbeat start
        env:
          RADAR_TRIGGER_SOURCE: ${{ inputs.trigger_source || 'external-cron' }}
          RADAR_EVENT_NAME: ${{ github.event_name }}
          RADAR_RUN_ID: ${{ github.run_id }}
          RADAR_RUN_NUMBER: ${{ github.run_number }}
          RADAR_ACTOR: ${{ github.actor }}
        run: |
          node -e '
          const fs = require("fs"); const now = new Date().toISOString();
          const data = { source: process.env.RADAR_TRIGGER_SOURCE || "external-cron", triggerEvent: process.env.RADAR_EVENT_NAME || "workflow_dispatch", workflowRunId: process.env.RADAR_RUN_ID || null, workflowRunNumber: Number(process.env.RADAR_RUN_NUMBER || 0) || null, actor: process.env.RADAR_ACTOR || null, lastRunAt: now, lastSuccessAt: null, status: "running", scheduleMinutes: 60 };
          fs.mkdirSync("public/data", { recursive: true }); fs.writeFileSync("public/data/heartbeat.json", JSON.stringify(data, null, 2)); console.log(`Heartbeat started: ${now}`);
          '
      - name: Run sentinel
        run: node watcher/sentinel.js
      - name: Run capture
        run: node watcher/capture.js
      - name: Run discovery
        run: node watcher/discovery.js
      - name: Run route and API discovery v2
        run: node watcher/route-api-discovery.js
      - name: Run chain intelligence
        run: node watcher/chain-intelligence.js
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
      - name: Probe Telegram health
        run: node watcher/telegram-health.js
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Build activation timeline v2
        run: node watcher/activation-timeline.js
      - name: Run radar
        run: node watcher/radar.js
      - name: Build activation decision v1
        run: node watcher/activation-decision.js
      - name: Archive exact sweep evidence v1
        run: node watcher/historical-evidence-archive.js
      - name: Run historical replay and calibration v3
        run: node watcher/historical-replay.js
      - name: Auto-label ground truth and correlate pre-event evidence v1
        run: node watcher/ground-truth-auto-label.js
      - name: Run pre-event signature intelligence v1
        run: node watcher/pre-event-signature-intelligence.js
      - name: Run calibration learning v1
        run: node watcher/calibration-learning.js
      - name: Prune old snapshots
        run: node watcher/prune-snapshots.js
      - name: Evaluate shared evidence (observation only)
        run: node watcher/evidence-observe.js
      - name: Write heartbeat success
        env:
          RADAR_TRIGGER_SOURCE: ${{ inputs.trigger_source || 'external-cron' }}
          RADAR_EVENT_NAME: ${{ github.event_name }}
          RADAR_RUN_ID: ${{ github.run_id }}
          RADAR_RUN_NUMBER: ${{ github.run_number }}
          RADAR_ACTOR: ${{ github.actor }}
        run: |
          node -e '
          const fs = require("fs"); const now = new Date().toISOString();
          const data = { source: process.env.RADAR_TRIGGER_SOURCE || "external-cron", triggerEvent: process.env.RADAR_EVENT_NAME || "workflow_dispatch", workflowRunId: process.env.RADAR_RUN_ID || null, workflowRunNumber: Number(process.env.RADAR_RUN_NUMBER || 0) || null, actor: process.env.RADAR_ACTOR || null, lastRunAt: now, lastSuccessAt: now, status: "success", scheduleMinutes: 60 };
          fs.writeFileSync("public/data/heartbeat.json", JSON.stringify(data, null, 2)); console.log(`Heartbeat success written: ${now}`);
          '
      - name: Build end-to-end system health
        run: node watcher/system-health.js
      - name: Verify heartbeat before publish
        run: |
          node -e '
          const fs = require("fs"); const heartbeat = JSON.parse(fs.readFileSync("public/data/heartbeat.json", "utf8")); const latest = JSON.parse(fs.readFileSync("public/data/latest.json", "utf8"));
          if (heartbeat.status !== "success") throw new Error(`Heartbeat status is not success: ${heartbeat.status}`);
          const heartbeatTime = new Date(heartbeat.lastSuccessAt).getTime(); const latestTime = new Date(latest.generatedAt).getTime();
          if (!Number.isFinite(heartbeatTime) || !Number.isFinite(latestTime)) throw new Error("Invalid heartbeat or latest timestamp");
          if (heartbeatTime < latestTime) throw new Error(`Heartbeat ${heartbeat.lastSuccessAt} is older than latest ${latest.generatedAt}`);
          console.log(`Heartbeat verified: ${heartbeat.lastSuccessAt}`); console.log(`Latest verified: ${latest.generatedAt}`);
          '
      - name: Prepare publish bundle
        run: |
          rm -rf .publish
          mkdir -p .publish/data .publish/snapshots
          cp public/data/*.json .publish/data/
          cp -R public/data/evidence-events public/data/evidence-sweeps .publish/data/
          if [ -d snapshots ]; then rsync -a --delete snapshots/ .publish/snapshots/; fi
      - name: Verify heartbeat publish bundle
        run: |
          node -e '
          const fs = require("fs"); const source = JSON.parse(fs.readFileSync("public/data/heartbeat.json", "utf8")); const bundled = JSON.parse(fs.readFileSync(".publish/data/heartbeat.json", "utf8"));
          if (source.lastSuccessAt !== bundled.lastSuccessAt) throw new Error(`Heartbeat bundle mismatch: source=${source.lastSuccessAt}, bundled=${bundled.lastSuccessAt}`);
          if (bundled.status !== "success") throw new Error(`Bundled heartbeat status is not success: ${bundled.status}`); console.log(`Publish heartbeat verified: ${bundled.lastSuccessAt}`);
          '
      - name: Publish to radar-data branch
        run: |
          git fetch origin radar-data || true
          git worktree prune
          rm -rf /tmp/radar-data
          if git ls-remote --exit-code --heads origin radar-data; then git worktree add /tmp/radar-data origin/radar-data; else git worktree add -b radar-data /tmp/radar-data; fi
          mkdir -p /tmp/radar-data/data /tmp/radar-data/snapshots
          rsync -a --delete --exclude='chain-baseline.json' .publish/data/ /tmp/radar-data/data/
          rsync -a --delete .publish/snapshots/ /tmp/radar-data/snapshots/
          cd /tmp/radar-data
          cp "$GITHUB_WORKSPACE/.publish/data/heartbeat.json" data/heartbeat.json
          cp "$GITHUB_WORKSPACE/.publish/data/latest.json" data/latest.json
          git config user.name "radar-bot"
          git config user.email "bot@radar.ai"
          git add data snapshots
          git add -f data/heartbeat.json data/latest.json
          cmp -s data/heartbeat.json "$GITHUB_WORKSPACE/.publish/data/heartbeat.json" || { echo "heartbeat mismatch before commit"; exit 1; }
          cmp -s data/latest.json "$GITHUB_WORKSPACE/.publish/data/latest.json" || { echo "latest mismatch before commit"; exit 1; }
          git commit -m "Auto radar data update" || echo "No changes"
          git show HEAD:data/heartbeat.json > /tmp/committed-heartbeat.json
          git show HEAD:data/latest.json > /tmp/committed-latest.json
          cmp -s /tmp/committed-heartbeat.json "$GITHUB_WORKSPACE/.publish/data/heartbeat.json" || { echo "committed heartbeat mismatch"; exit 1; }
          cmp -s /tmp/committed-latest.json "$GITHUB_WORKSPACE/.publish/data/latest.json" || { echo "committed latest mismatch"; exit 1; }
          git push origin HEAD:radar-data
          cd -
          git worktree remove /tmp/radar-data --force || true
          rm -rf /tmp/radar-data || true
